# Veröffentlicht die Seite auf GitHub Pages.
#
# EINMALIG NÖTIG: Repository → Settings → Pages → Source auf "GitHub Actions".
# Solange das fehlt, laufen die Tests durch, der deploy-Job bricht aber ab mit
#   Get Pages site failed ... verify that the repository has Pages enabled
# Automatisieren lässt sich das nicht: das Anlegen der Pages-Site verlangt
# Admin-Rechte, die GITHUB_TOKEN nicht hat (enablement: true scheitert an
# "Create Pages site failed: Resource not accessible by integration").
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
